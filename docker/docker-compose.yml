# Reproducible local stack for the AI-Driven platform.
# Usage:
#   cd docker && docker compose up -d
# Then back in repo root:
#   make run                     # starts backend on :8888 in debug mode
#   cd ai-driven-web-ui && npm run dev   # starts frontend on :3000

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai_driven
      POSTGRES_PASSWORD: ai_driven
      POSTGRES_DB: ai_driven
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_driven -d ai_driven"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stubs for AWS services so the platform runs without real AWS.
  # DynamoDB tables + SQS queues can still be missing — the backend has
  # graceful fallbacks (see src/ai_driven/db/dynamo/models.py and
  # src/ai_driven/queue/producer.py).
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,sqs
      DEBUG: 0
      PERSISTENCE: 0
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  pg_data:
  localstack_data:
