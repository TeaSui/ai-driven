# T27 — Phase 2 dogfood corpus.
#
# A realistic batch of ~55 tickets spanning all three routing tiers
# (fast_path, full_workflow, multi_domain) plus ~5 intentional-block
# tickets that Security should reject. Individual authors tune after
# the first run; this is the baseline.
#
# Schema (per ticket):
#   id              (str, required)    — stable identifier used in reports
#   tier_expected   (str, required)    — fast_path | full_workflow | multi_domain
#   repo            (str, optional)    — defaults to MinnMinn/skills-introduction-to-github
#   message         (str, required)    — the natural-language ticket body
#   expected_outcome (str, optional)   — blocked | completed — for
#                                        intentional-block tickets this
#                                        asserts Security rejects the
#                                        request; mismatch is flagged
#                                        in the report as a regression.

# ============================================================================
